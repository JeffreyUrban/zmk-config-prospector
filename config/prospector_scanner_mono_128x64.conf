# Personal channel pairing for the touch-free mono scanner (see the shield's
# README). Must match CONFIG_PROSPECTOR_CHANNEL on your keyboard. Pick your own
# random 1-255 value if you fork this config, to avoid colliding with nearby
# uncoordinated users.
CONFIG_PROSPECTOR_SCANNER_CHANNEL=150

# Opt into the packed, field-selectable advertisement (must match the keyboard).
# Field selection uses module defaults on both ends, so the layout version hash
# agrees automatically. Enables the 6-char layer name.
CONFIG_PROSPECTOR_ADV_PACKED=y
